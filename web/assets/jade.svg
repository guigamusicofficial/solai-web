<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090711"/>
    <stop offset="1" stop-color="#32134a"/>
  </linearGradient>
  <radialGradient id="skin">
    <stop offset="0" stop-color="#9b6854"/>
    <stop offset="1" stop-color="#542d27"/>
  </radialGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#b76cff" stop-opacity=".5"/>
    <stop offset="1" stop-color="#5d20a0" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="500" height="700" fill="url(#bg)"/>
<circle cx="250" cy="300" r="220" fill="url(#glow)"/>

<!-- cabelo -->
<path d="M105 275 Q65 105 185 50 Q275 5 375 75 Q445 125 395 300
         L355 260 Q350 145 250 130 Q145 145 130 285Z"
      fill="#151019"/>

<!-- rosto -->
<path d="M145 245 Q145 155 250 140 Q355 155 355 245
         L335 415 Q300 480 250 490 Q200 480 165 415Z"
      fill="url(#skin)"/>

<!-- cabelo frontal -->
<path d="M155 245 Q165 155 250 145 Q335 155 345 245
         Q315 210 290 205 Q250 220 205 202 Q175 215 155 245Z"
      fill="#20151f"/>

<!-- olhos -->
<ellipse cx="207" cy="285" rx="15" ry="10" fill="#151019"/>
<ellipse cx="293" cy="285" rx="15" ry="10" fill="#151019"/>

<!-- boca -->
<path d="M205 350 Q250 378 295 350"
      fill="none" stroke="#351b27" stroke-width="9"
      stroke-linecap="round"/>

<!-- roupa -->
<path d="M115 650 Q125 490 250 465 Q375 490 385 650Z"
      fill="#121017"/>

<!-- cabelo lateral -->
<path d="M160 225 Q95 155 145 90 Q160 45 220 40
         Q180 85 185 130 Q125 125 160 225Z"
      fill="#211823"/>

<path d="M340 225 Q405 155 355 90 Q340 45 280 40
         Q320 85 315 130 Q375 125 340 225Z"
      fill="#211823"/>

<text x="250" y="675"
      text-anchor="middle"
      fill="#d7b8ff"
      font-family="Arial,sans-serif"
      font-size="25"
      letter-spacing="6">JADE</text>
</svg>
